name: "Download team badges (Fase 1)"

on:
  workflow_dispatch:
    inputs:
      liga:
        description: "Slug da liga (ex.: bra-a)"
        required: false
        default: "bra-a"

jobs:
  download-badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Baixar badges e finalizar schema de teams.json
        run: node scripts/download-badges.js --liga=${{ inputs.liga || 'bra-a' }}
      - name: Commit badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ img/
          git diff --cached --quiet || git commit -m "img: download team badges for ${{ inputs.liga || 'bra-a' }}"
          git push
