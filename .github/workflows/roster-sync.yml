name: "Roster sync"

on:
  schedule:
    - cron: "0 10 * * 1" # segundas, ~07:00 America/Sao_Paulo (UTC-3)
  workflow_dispatch:
    inputs:
      liga:
        description: "Rodar só uma liga (slug). Vazio = todas as active."
        required: false
        default: ""

jobs:
  roster-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rodar roster-sync
        run: node scripts/roster-sync.js ${{ inputs.liga != '' && format('--liga={0}', inputs.liga) || '' }}
      - name: Commit players.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: roster sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
