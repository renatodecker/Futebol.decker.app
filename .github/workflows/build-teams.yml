name: "Build teams.json (Fase 1 skeleton)"

on:
  workflow_dispatch:
    inputs:
      liga:
        description: "Slug da liga (ex.: bra-a)"
        required: false
        default: "bra-a"

jobs:
  build-teams:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Gerar esqueleto de teams.json
        run: node scripts/build-teams.js --liga=${{ inputs.liga || 'bra-a' }}
      - name: Commit esqueleto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ img/
          git diff --cached --quiet || git commit -m "data: teams.json skeleton for ${{ inputs.liga || 'bra-a' }} (ESPN only, needs manual review)"
          git push
