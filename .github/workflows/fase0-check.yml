name: Fase 0 - Gate de viabilidade

on:
  workflow_dispatch:
    inputs:
      liga:
        description: "Slug da liga (ex.: bra-a)"
        required: false
        default: "bra-a"

jobs:
  fase0:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rodar gate de viabilidade
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/fase0-check.js --liga=${{ inputs.liga || 'bra-a' }}
      - name: Commit relatório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "docs: fase 0 report for ${{ inputs.liga || 'bra-a' }}"
          git push
