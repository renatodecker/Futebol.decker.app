<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>futebol.decker.app.br</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <!-- ?v= é cache-busting manual: bump sempre que css/style.css ou js/*.js
       mudar, senão o navegador/CDN pode continuar servindo a versão antiga
       desses arquivos por um bom tempo mesmo depois do deploy (o site não
       tem build com hash de conteúdo no nome do arquivo). -->
  <link rel="stylesheet" href="css/style.css?v=20260718f" />
</head>
<body>
  <header class="site-header">
    <div class="header-row">
      <div class="header-left">
        <a class="decker-home-link" href="https://decker.app.br" aria-label="Voltar para decker.app.br" title="decker.app.br">
          <svg class="decker-mark" viewBox="0 0 42 42" aria-hidden="true">
            <rect x="0" y="10" width="26" height="26" rx="4" fill="#185FA5" opacity="0.5" />
            <rect x="6" y="4" width="26" height="26" rx="4" fill="#378ADD" />
          </svg>
        </a>
        <a class="brand" href="/">
          <span class="brand-name">futebol<span class="brand-dot">.</span>decker</span>
        </a>
      </div>
      <div class="header-right">
        <button class="hub-back-btn" id="hubBackBtn" hidden>
          <span aria-hidden="true">‹</span> Início
        </button>
        <button class="league-picker-toggle" id="leaguePickerToggle" aria-haspopup="dialog" aria-controls="leagueModal">
          <img id="currentLeagueLogo" class="league-logo" alt="" />
          <span id="currentLeagueName">Carregando…</span>
          <span class="chevron">▾</span>
        </button>
      </div>
    </div>
  </header>

  <nav class="live-bar" id="liveBar" hidden>
    <span class="live-dot"></span>
    <span id="liveBarText">Ao vivo</span>
  </nav>

  <section id="hubView" hidden>
    <div id="hubLiveSection" hidden>
      <h2 class="section-title section-title-live">
        <span class="live-dot"></span>
        Ao vivo
      </h2>
      <div class="match-list" id="hubLiveMatches"></div>
    </div>

    <h2 class="section-title">Campeonatos</h2>
    <div class="league-cards-grid" id="hubLeagueCards"></div>
  </section>

  <nav class="tab-bar" id="tabBar">
    <button class="tab-btn is-active" data-tab="home">Home</button>
    <button class="tab-btn" data-tab="classificacao">Classificação</button>
    <button class="tab-btn" data-tab="playoffs" id="playoffsTabBtn" hidden>Playoffs</button>
    <button class="tab-btn" data-tab="rodadas">Rodadas</button>
    <button class="tab-btn" data-tab="meses">Meses</button>
    <button class="tab-btn" data-tab="estatisticas">Estatísticas</button>
  </nav>

  <main id="app">
    <section class="tab-panel is-active" id="tab-home" data-tab-panel="home">
      <div class="league-hero" id="leagueHero"></div>

      <div class="skin-reset-row">
        <button class="skin-reset-btn" id="skinResetBtn" hidden>tema da liga</button>
      </div>

      <h2 class="section-title">Escolha seu time</h2>
      <div class="team-frame" id="teamFrame"></div>

      <h2 class="section-title">Destaques do campeonato</h2>
      <div class="highlights-grid" id="highlightsGrid"></div>

      <div id="liveMatchesSection" hidden>
        <h2 class="section-title section-title-live">
          <span class="live-dot"></span>
          Ao vivo
        </h2>
        <div class="match-list" id="liveMatches"></div>
      </div>

      <div class="home-games-grid">
        <div class="home-games-col">
          <h2 class="section-title">Próximos jogos</h2>
          <div class="match-list" id="upcomingFixtures"></div>
        </div>
        <div class="home-games-col">
          <h2 class="section-title">Últimos resultados</h2>
          <div class="match-list" id="recentResults"></div>
        </div>
      </div>
    </section>

    <section class="tab-panel" id="tab-classificacao" data-tab-panel="classificacao">
      <div id="standingsBadge" class="standings-badge" hidden></div>
      <div class="table-scroll">
        <table class="standings-table" id="standingsTable">
          <thead>
            <tr>
              <th class="col-pos">#</th>
              <th class="col-team">Time</th>
              <th>P</th>
              <th>J</th>
              <th>V</th>
              <th>E</th>
              <th>D</th>
              <th>GP</th>
              <th>GC</th>
              <th>SG</th>
              <th>%</th>
              <th class="col-form">Forma</th>
            </tr>
          </thead>
          <tbody id="standingsBody"></tbody>
        </table>
      </div>
      <ul class="zones-legend" id="zonesLegend"></ul>
    </section>

    <section class="tab-panel" id="tab-playoffs" data-tab-panel="playoffs">
      <div id="playoffsContent"></div>
    </section>

    <section class="tab-panel" id="tab-rodadas" data-tab-panel="rodadas">
      <div class="accordion" id="rodadasAccordion"></div>
    </section>

    <section class="tab-panel" id="tab-meses" data-tab-panel="meses">
      <div class="accordion" id="mesesAccordion"></div>
    </section>

    <section class="tab-panel" id="tab-estatisticas" data-tab-panel="estatisticas">
      <div class="stats-controls">
        <select id="statsTeamFilter">
          <option value="">Todos os times</option>
        </select>
        <button class="toggle-btn" id="statsTop20Toggle">Top 20 por categoria</button>
      </div>

      <div id="statsTeamBlock" class="team-stats-block" hidden></div>

      <div id="statsFullView">
        <div class="table-scroll">
          <table class="stats-table" id="statsTable">
            <thead>
              <tr>
                <th class="col-team">Jogador</th>
                <th data-sort="goals">Gols</th>
                <th data-sort="assists">Assist.</th>
                <th data-sort="yellow">Amarelos</th>
                <th data-sort="red">Vermelhos</th>
              </tr>
            </thead>
            <tbody id="statsBody"></tbody>
          </table>
        </div>
      </div>

      <div id="statsTop20View" hidden></div>
    </section>
  </main>

  <div class="squad-modal" id="squadModal" hidden>
    <div class="squad-modal-backdrop" id="squadModalBackdrop"></div>
    <div class="squad-modal-content" id="squadModalContent"></div>
  </div>

  <div class="squad-modal" id="matchModal" hidden>
    <div class="squad-modal-backdrop" id="matchModalBackdrop"></div>
    <div class="squad-modal-content" id="matchModalContent"></div>
  </div>

  <div class="squad-modal" id="leagueModal" hidden>
    <div class="squad-modal-backdrop" id="leagueModalBackdrop"></div>
    <div class="squad-modal-content league-modal-content" id="leagueModalContent">
      <button class="squad-close-btn" id="leagueModalCloseBtn" aria-label="Fechar">✕</button>
      <h3 class="league-modal-title">Escolher campeonato</h3>
      <div class="league-modal-list" id="leagueModalList"></div>
    </div>
  </div>

  <script type="module" src="js/theme.js?v=20260712a"></script>
  <script type="module" src="js/standings.js?v=20260718c"></script>
  <script type="module" src="js/playoffs.js?v=20260718b"></script>
  <script type="module" src="js/app.js?v=20260718h"></script>
</body>
</html>
